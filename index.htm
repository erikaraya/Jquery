<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1º Exemplo Jquery</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1 id="titulo">Título antigo</h1>
    <button id="btn-mudar">Mudar Texto</button>

    <script>
        $(document).ready(function(){
            $("#btn-mudar").click(function(){
                $("#titulo").text("Texto alterado com Jquery!")
            })
        })
    </script>
    
</body>
</html>
